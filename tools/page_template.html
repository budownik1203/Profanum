<title>Profanum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Spectral:wght@400;600&display=swap">
<style>
  /* The game canvas fills the frame; a quiet loading line shows until PixiJS is ready. */
  :root {
    color-scheme: dark;
    --ink: #0a0807;
    --ash: #d8c8a8;
    --ash-dim: #8a7e6c;
    --ember: #ff6a1c;
    --display: "IM Fell English SC", Georgia, "Times New Roman", serif;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ink); color: var(--ash); font-family: var(--display); overflow: hidden; }
  canvas { display: block; cursor: crosshair; touch-action: none; }
  .loading {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 16px;
    pointer-events: none;
  }
  .loading h1 { margin: 0 0 8px; font-weight: 400; font-size: clamp(40px, 9vw, 96px); letter-spacing: 0.04em; }
  .loading p { margin: 0; color: var(--ash-dim); font-size: 16px; }
</style>

<div class="loading" id="loading">
  <div><h1>Profanum</h1><p id="status">Wczytywanie… / Loading…</p></div>
</div>

<script>
  // PixiJS v8 from the CDN, with a fallback version if the first one fails to load.
  (function loadPixi() {
    const sources = [
      "https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js",
      "https://cdn.jsdelivr.net/npm/pixi.js@8.5.2/dist/pixi.min.js",
      "https://unpkg.com/pixi.js@8.6.6/dist/pixi.min.js",
    ];
    const status = document.getElementById("status");
    const tryNext = (i) => {
      if (i >= sources.length) {
        status.textContent = "Nie udało się wczytać PixiJS. Odśwież stronę. / Could not load PixiJS. Please reload.";
        return;
      }
      const s = document.createElement("script");
      s.src = sources[i];
      s.onload = () => {
        if (typeof PIXI === "undefined") return tryNext(i + 1);
        document.getElementById("loading").remove();
        startGame();
      };
      s.onerror = () => tryNext(i + 1);
      document.head.appendChild(s);
    };
    tryNext(0);
  })();

  function startGame() {
/*__GAME__*/
  }
</script>
